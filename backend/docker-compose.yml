version: '3.9'

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-companion-api
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      # ⚠️  Copy .env.example to .env and fill in values before running
      MONGODB_URI: mongodb://mongo:27017/ai-study-companion
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./uploads:/app/uploads    # persist uploaded PDFs
      - .:/app                    # live reload in dev
      - /app/node_modules         # don't overwrite container node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - study-net

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: study-companion-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db       # persist data between restarts
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - study-net

  # ── Mongo Express (DB UI — optional) ────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: study-companion-mongoui
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - study-net
    profiles:
      - tools   # only starts with: docker compose --profile tools up

volumes:
  mongo_data:

networks:
  study-net:
    driver: bridge
